name: shift_mate
description: "교대 근무 일정 관리 및 공유 앱"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8

  # 상태관리
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # 네트워크
  dio: ^5.7.0

  # 카카오 로그인
  kakao_flutter_sdk_user: ^1.9.5

  # 네이버 로그인 (네이티브 SDK)
  naver_login_flutter: 3.0.4

  # Google 로그인 (ID Token 서버 검증)
  google_sign_in: 7.2.0

  # Apple 로그인 (Flutter 3.38.5 / Dart 3.10 호환 버전)
  sign_in_with_apple: 7.0.1

  # 캘린더
  table_calendar: ^3.1.3

  # 날짜/시간
  intl: ^0.20.1

  # 로컬 저장소
  shared_preferences: ^2.3.4
  flutter_secure_storage: 10.3.1
  # 푸시 알림
  firebase_core: 4.12.1
  firebase_messaging: 16.4.3
  flutter_local_notifications: 22.2.0
  package_info_plus: 10.2.1
  uuid: 4.5.2

  # 환경 변수
  flutter_dotenv: ^5.1.0

  # 유틸리티
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  equatable: ^2.0.7
  timezone: ^0.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # 코드 생성
  build_runner: ^2.4.14
  freezed: ^2.5.7
  json_serializable: ^6.9.2
  riverpod_generator: ^2.6.3

  # 앱 아이콘 생성
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/icons/app_icon.png"
  min_sdk_android: 21
  remove_alpha_ios: true

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - .env
